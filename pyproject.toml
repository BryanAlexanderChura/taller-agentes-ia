[project]
name = "taller-agentes-ia"
version = "0.1.0"
description = "Taller de agentes de IA: sesiones en marimo y scripts de instalación"
requires-python = ">=3.12"
dependencies = [
    "altair>=6.3.0",
    "marimo",
    "numpy>=2.5.4",
    "polars>=2.1.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# marimo exige un return al final de cada celda
"sesiones/*.py" = ["PLR1711"]
# en los notebooks de demo, una expresión suelta al final de la celda es su salida
"sesiones/demos/*.py" = ["PLR1711", "B018"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
