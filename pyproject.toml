[project]
name = "taller-agentes-ia"
version = "0.1.0"
description = "Taller de agentes de IA: sesiones en marimo y scripts de instalación"
requires-python = ">=3.12"
dependencies = [
    "marimo",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint.per-file-ignores]
# marimo exige un return al final de cada celda
"sesiones/*.py" = ["PLR1711"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]
