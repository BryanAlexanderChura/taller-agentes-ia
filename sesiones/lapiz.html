<!-- Lápiz momentáneo para anotar sobre la diapositiva.
     D o el botón de arriba a la derecha lo activan; Esc o D lo apagan; Z (o Ctrl+Z) borra el último trazo.
     Cada trazo dura 10 segundos y todo se borra al cambiar de diapositiva.
     Coordenadas absolutas de pantalla: el puntero se lee en window (clientX/clientY) y se dibuja
     en la capa superior del navegador (popover), sin heredar escalas ni transformaciones de la
     página. En pantalla completa lo de fuera queda inerte, por eso nada depende de recibir clics. -->
<style>
  #lapiz-capa {
    position: fixed; inset: 0; width: 100vw; height: 100vh; max-width: none; max-height: none;
    margin: 0; padding: 0; border: 0; background: transparent; overflow: hidden; pointer-events: none;
  }
  #lapiz-lienzo { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  html.lapiz-activo, html.lapiz-activo * { cursor: crosshair !important; touch-action: none; user-select: none; }
  #lapiz-boton {
    position: absolute; top: 10px; right: 52px; width: 30px; height: 30px; pointer-events: auto;
    display: grid; place-items: center; border-radius: 6px; cursor: pointer;
    background: #121212; border: 1px solid #404040; color: #737373; opacity: 0.45;
  }
  #lapiz-boton:hover { opacity: 1; }
  #lapiz-boton.activo { opacity: 1; color: #a3e635; border-color: #a3e635; }
</style>
<script>
  (() => {
    const COLOR = "#a3e635", GROSOR = 4, VIDA_MS = 9000, FUNDIDO_MS = 1000;
    const TECLAS_NAVEGAR = ["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", "PageUp", "PageDown", " ", "Home", "End"];
    let capa, lienzo, ctx, boton, activo = false, trazos = [], actual = null;

    function ajustar() {
      const r = window.devicePixelRatio || 1;
      lienzo.width = innerWidth * r;
      lienzo.height = innerHeight * r;
      ctx.setTransform(r, 0, 0, r, 0, 0);
    }

    // Mostrar de nuevo el popover lo deja encima de todo, incluido un elemento en pantalla completa.
    function alFrente() {
      if (capa.matches(":popover-open")) capa.hidePopover();
      capa.showPopover();
      ajustar();
    }

    function activar(si) {
      activo = si;
      document.documentElement.classList.toggle("lapiz-activo", si);
      boton.classList.toggle("activo", si);
    }

    function borrarTodo() { trazos = []; actual = null; }

    function dibujar() {
      const ahora = performance.now();
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      trazos = trazos.filter((t) => t === actual || ahora - t.fin < VIDA_MS + FUNDIDO_MS);
      ctx.strokeStyle = COLOR;
      ctx.lineWidth = GROSOR;
      ctx.lineCap = ctx.lineJoin = "round";
      for (const t of trazos) {
        const edad = t === actual ? 0 : ahora - t.fin;
        ctx.globalAlpha = edad < VIDA_MS ? 1 : 1 - (edad - VIDA_MS) / FUNDIDO_MS;
        ctx.beginPath();
        t.puntos.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
        if (t.puntos.length === 1) ctx.lineTo(t.puntos[0][0] + 0.01, t.puntos[0][1]);
        ctx.stroke();
      }
      requestAnimationFrame(dibujar);
    }

    function iniciar() {
      capa = document.createElement("div");
      capa.id = "lapiz-capa";
      capa.popover = "manual";
      lienzo = document.createElement("canvas");
      lienzo.id = "lapiz-lienzo";
      ctx = lienzo.getContext("2d");
      boton = document.createElement("button");
      boton.id = "lapiz-boton";
      boton.title = "Lápiz (D) · deshacer (Z)";
      boton.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>';
      capa.append(lienzo, boton);
      document.body.append(capa);
      alFrente();
      addEventListener("resize", ajustar);
      document.addEventListener("fullscreenchange", alFrente);

      const sobreBoton = (e) => {
        const r = boton.getBoundingClientRect();
        return e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom;
      };
      const tragar = (e) => { e.stopPropagation(); e.preventDefault(); };
      addEventListener("pointerdown", (e) => {
        if (sobreBoton(e)) { activar(!activo); tragar(e); return; }
        if (!activo) { borrarTodo(); return; }
        actual = { puntos: [[e.clientX, e.clientY]], fin: 0 };
        trazos.push(actual);
        tragar(e);
      }, true);
      addEventListener("pointermove", (e) => {
        if (!actual) return;
        const eventos = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
        for (const ev of eventos) actual.puntos.push([ev.clientX, ev.clientY]);
        tragar(e);
      }, true);
      const soltar = (e) => { if (actual) { actual.fin = performance.now(); actual = null; tragar(e); } };
      addEventListener("pointerup", soltar, true);
      addEventListener("pointercancel", soltar, true);
      addEventListener("click", (e) => { if (activo || sobreBoton(e)) tragar(e); }, true);

      addEventListener("keydown", (e) => {
        const t = e.target;
        if (t.isContentEditable || ["INPUT", "TEXTAREA", "SELECT"].includes(t.tagName)) return;
        const tecla = e.key.toLowerCase();
        if (tecla === "d" && !e.ctrlKey && !e.metaKey) activar(!activo);
        else if (tecla === "z") { if (!actual) trazos.pop(); }
        else if (e.key === "Escape" && activo) activar(false);
        else { if (TECLAS_NAVEGAR.includes(e.key)) borrarTodo(); return; }
        e.stopPropagation();
        e.preventDefault();
      }, true);

      requestAnimationFrame(dibujar);
    }

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", iniciar);
    else iniciar();
  })();
</script>
