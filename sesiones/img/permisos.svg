<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Permisos por grados: según lo que cuesta deshacer. -->
  <defs>
    <linearGradient id="riesgo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a3e635"/>
      <stop offset="0.5" stop-color="#facc15"/>
      <stop offset="1" stop-color="#f87171"/>
    </linearGradient>
  </defs>
  <text x="40" y="30" font-size="12" fill="#737373">fácil de deshacer</text>
  <text x="860" y="30" font-size="12" fill="#737373" text-anchor="end">imposible de deshacer</text>
  <rect x="40" y="44" width="820" height="10" rx="5" fill="url(#riesgo)"/>

  <g font-size="14" font-weight="700" text-anchor="middle">
    <rect x="40" y="76" width="180" height="56" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="130" y="110" fill="#a3e635">leer</text>
    <rect x="253" y="76" width="180" height="56" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="343" y="110" fill="#a3e635">editar</text>
    <rect x="466" y="76" width="180" height="56" rx="6" fill="#121212" stroke="#facc15" stroke-width="2"/>
    <text x="556" y="110" fill="#facc15">bash</text>
    <rect x="680" y="76" width="180" height="56" rx="6" fill="#121212" stroke="#f87171" stroke-width="2"/>
    <text x="770" y="104" fill="#f87171">push, borrar,</text>
    <text x="770" y="122" fill="#f87171">base de datos</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <text x="236" y="156" fill="#a3e635">fluye</text>
    <text x="556" y="156" fill="#facc15">según el comando</text>
    <text x="770" y="156" fill="#f87171">pregunta primero</text>
  </g>
  <rect x="40" y="176" width="393" height="34" rx="4" fill="#a3e635" fill-opacity="0.08" stroke="#a3e635" stroke-width="1" stroke-dasharray="5 4"/>
  <text x="236" y="198" font-size="12" fill="#a3e635" text-anchor="middle">git: punto de retorno</text>
</svg>
