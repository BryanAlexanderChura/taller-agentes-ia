<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Una skill crece con fallos reales: fallo, regla, historial, el próximo chat no repite el error. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <g font-size="17" font-weight="700" text-anchor="middle">
    <rect x="200" y="20" width="200" height="74" rx="6" fill="#121212" stroke="#f87171" stroke-width="2"/>
    <text x="300" y="52" fill="#f87171">fallo real</text>
    <rect x="390" y="170" width="190" height="74" rx="6" fill="#121212" stroke="#facc15" stroke-width="2"/>
    <text x="485" y="202" fill="#facc15">regla nueva</text>
    <rect x="200" y="320" width="200" height="74" rx="6" fill="#121212" stroke="#67e8f9" stroke-width="2"/>
    <text x="300" y="352" fill="#67e8f9">historial</text>
    <rect x="20" y="170" width="190" height="74" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="115" y="202" fill="#a3e635">no se repite</text>
  </g>
  <g font-size="12" fill="#a3a3a3" text-anchor="middle">
    <text x="300" y="76">el agente se equivoca</text>
    <text x="485" y="226">escrita en la skill</text>
    <text x="300" y="376">regla y su fallo</text>
    <text x="115" y="226">el próximo chat la sigue</text>
  </g>
  <g stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M402,60 C470,70 490,110 488,164"/>
    <path d="M488,250 C490,300 460,340 406,350"/>
    <path d="M196,350 C140,340 112,300 112,250"/>
    <path d="M112,164 C112,110 140,70 196,60" stroke-dasharray="6 5"/>
  </g>
</svg>
