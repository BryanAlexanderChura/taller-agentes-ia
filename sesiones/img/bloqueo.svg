<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- El hook revisa cada comando antes de que corra: pasa o se bloquea con motivo. -->
  <defs>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
    <marker id="rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <g font-size="16" text-anchor="middle">
    <rect x="200" y="20" width="200" height="64" rx="6" fill="#121212" stroke="#fafafa" stroke-width="2"/>
    <text x="300" y="48" fill="#fafafa" font-weight="700">el agente pide</text>
    <text x="300" y="70" fill="#a3a3a3" font-size="13">un comando</text>

    <rect x="200" y="134" width="200" height="70" rx="6" fill="#121212" stroke="#facc15" stroke-width="2.5"/>
    <text x="300" y="164" fill="#facc15" font-weight="700">hook</text>
    <text x="300" y="186" fill="#a3a3a3" font-size="13">antes de correr</text>

    <rect x="20" y="270" width="230" height="84" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="135" y="302" fill="#a3e635" font-weight="700">pasa</text>
    <text x="135" y="326" fill="#a3a3a3" font-size="13">uv run pytest</text>

    <rect x="350" y="270" width="230" height="84" rx="6" fill="#121212" stroke="#f87171" stroke-width="2"/>
    <text x="465" y="302" fill="#f87171" font-weight="700">bloqueado</text>
    <text x="465" y="326" fill="#a3a3a3" font-size="13">"usa legacy/, no borres"</text>
  </g>
  <path d="M300,88 L300,128" stroke="#525252" stroke-width="2.5" fill="none" marker-end="url(#gris)"/>
  <path d="M250,204 C200,230 150,240 140,264" stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#verde)"/>
  <path d="M350,204 C400,230 450,240 460,264" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#rojo)"/>
  <path d="M580,312 C600,200 520,60 406,52" stroke="#f87171" stroke-width="1.5" stroke-dasharray="5 5" fill="none" marker-end="url(#rojo)"/>
  <text x="300" y="396" font-size="13" fill="#737373" text-anchor="middle">el motivo vuelve al agente: busca otro camino</text>
</svg>
