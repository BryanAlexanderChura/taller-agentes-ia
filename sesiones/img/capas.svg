<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Las extensiones se ordenan por cuándo ocupan contexto. Curar es bajar cada cosa a la franja más baja posible. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>

  <rect x="20" y="20" width="130" height="290" rx="8" fill="#121212" stroke="#fafafa" stroke-width="2"/>
  <text x="85" y="160" font-size="18" font-weight="700" fill="#fafafa" text-anchor="middle">agente</text>
  <text x="85" y="182" font-size="12" fill="#737373" text-anchor="middle">su contexto</text>

  <rect x="170" y="20" width="620" height="86" rx="6" fill="#f87171" fill-opacity="0.08" stroke="#f87171" stroke-width="1.5"/>
  <rect x="170" y="122" width="620" height="86" rx="6" fill="#facc15" fill-opacity="0.06" stroke="#facc15" stroke-width="1.5"/>
  <rect x="170" y="224" width="620" height="86" rx="6" fill="#a3e635" fill-opacity="0.06" stroke="#a3e635" stroke-width="1.5" stroke-dasharray="7 5"/>

  <g font-size="13" font-weight="700">
    <text x="186" y="44" fill="#f87171">SIEMPRE</text>
    <text x="186" y="146" fill="#facc15">A DEMANDA</text>
    <text x="186" y="248" fill="#a3e635">FUERA DEL CONTEXTO</text>
  </g>
  <g font-size="12" fill="#a3a3a3">
    <text x="186" y="94">cuesta en cada turno</text>
    <text x="186" y="196">entra solo al usarse</text>
    <text x="186" y="298">es código: cero tokens</text>
  </g>

  <g font-size="15" text-anchor="middle">
    <rect x="390" y="40" width="160" height="46" rx="5" fill="#121212" stroke="#f87171" stroke-width="2"/>
    <text x="470" y="62" fill="#fafafa" font-weight="700">AGENTS.md</text>
    <text x="470" y="78" fill="#f87171" font-size="11">pide</text>

    <rect x="390" y="142" width="120" height="46" rx="5" fill="#121212" stroke="#facc15" stroke-width="2"/>
    <text x="450" y="164" fill="#fafafa" font-weight="700">skills</text>
    <text x="450" y="180" fill="#facc15" font-size="11">enseñan</text>
    <rect x="520" y="142" width="120" height="46" rx="5" fill="#121212" stroke="#facc15" stroke-width="2"/>
    <text x="580" y="164" fill="#fafafa" font-weight="700">CLI</text>
    <text x="580" y="180" fill="#facc15" font-size="11">conecta</text>
    <rect x="650" y="142" width="120" height="46" rx="5" fill="#121212" stroke="#facc15" stroke-width="2"/>
    <text x="710" y="164" fill="#fafafa" font-weight="700">MCP</text>
    <text x="710" y="180" fill="#facc15" font-size="11">conecta</text>

    <rect x="390" y="244" width="120" height="46" rx="5" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="450" y="266" fill="#fafafa" font-weight="700">hooks</text>
    <text x="450" y="282" fill="#a3e635" font-size="11">obligan</text>
    <rect x="520" y="244" width="120" height="46" rx="5" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="580" y="266" fill="#fafafa" font-weight="700">scripts</text>
    <text x="580" y="282" fill="#a3e635" font-size="11">ejecutan</text>
  </g>

  <path d="M840,40 L840,290" stroke="#a3e635" stroke-width="3" fill="none" marker-end="url(#flecha)"/>
  <g font-size="13" fill="#a3e635" text-anchor="middle" font-weight="700">
    <text x="868" y="150" transform="rotate(90 868 150)">curar: bajar</text>
  </g>
</svg>
