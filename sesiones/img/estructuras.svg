    <text x="630" y="50">Cookiecutter Data Science</text>
  </g>

  <rect x="20" y="62" width="270" height="250" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
  <g font-size="15" fill="#d4d4d4">
