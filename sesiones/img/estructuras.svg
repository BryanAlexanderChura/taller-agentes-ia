    <text x="660" y="124">data/</text>
    <text x="680" y="148" fill="#a3a3a3" font-size="13">raw · processed</text>
    <text x="660" y="176">notebooks/</text>
    <text x="660" y="204">models/</text>
    <text x="660" y="232">reports/</text>
    <text x="660" y="260">src/</text>
  </g>
