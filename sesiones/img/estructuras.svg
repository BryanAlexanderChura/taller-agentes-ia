    <text x="60" y="204">tests/</text>
    <text x="60" y="232">docs/</text>
    <text x="60" y="260">config/</text>
  </g>

  <rect x="320" y="62" width="270" height="250" rx="6" fill="#121212" stroke="#67e8f9" stroke-width="2"/>
  <g font-size="15" fill="#d4d4d4">
    <text x="340" y="94" fill="#fafafa" font-weight="700">mi_paquete/</text>
    <text x="360" y="124">src/</text>
    <text x="380" y="148" fill="#a3a3a3" font-size="13">mi_paquete/</text>
    <text x="360" y="176">tests/</text>
    <text x="360" y="204">docs/</text>
    <text x="360" y="232">pyproject.toml</text>
  </g>

  <rect x="620" y="62" width="270" height="250" rx="6" fill="#121212" stroke="#facc15" stroke-width="2"/>
  <g font-size="15" fill="#d4d4d4">
