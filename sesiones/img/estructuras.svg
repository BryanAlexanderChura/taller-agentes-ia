<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Tres estructuras estándar según lo que se construye. Ninguna es la única. -->
  <g font-size="16" font-weight="700">
    <text x="30" y="30" fill="#a3e635">pipeline de datos</text>
    <text x="330" y="30" fill="#67e8f9">paquete Python</text>
    <text x="630" y="30" fill="#facc15">ciencia de datos</text>
  </g>
  <g font-size="12" fill="#737373">
    <text x="30" y="50">el del taller (medallion)</text>
