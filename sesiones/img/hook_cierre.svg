<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- El agente dice "listo"; el hook corre el checker antes de dejarlo cerrar. -->
  <defs>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
    <marker id="rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <rect x="110" y="20" width="380" height="64" rx="6" fill="#121212" stroke="#fafafa" stroke-width="2"/>
  <text x="300" y="47" font-size="15" fill="#a3a3a3" text-anchor="middle">agente:</text>
  <text x="300" y="70" font-size="16" fill="#fafafa" font-weight="700" text-anchor="middle">"la tabla de shocks está lista"</text>

  <path d="M300,88 L300,124" stroke="#525252" stroke-width="2.5" marker-end="url(#gris)"/>

  <rect x="150" y="130" width="300" height="76" rx="6" fill="#121212" stroke="#facc15" stroke-width="2.5"/>
  <text x="300" y="160" font-size="17" fill="#facc15" font-weight="700" text-anchor="middle">hook al cerrar</text>
  <text x="300" y="186" font-size="14" fill="#d4d4d4" text-anchor="middle">corre check.py panel_macro</text>

  <rect x="20" y="270" width="250" height="84" rx="6" fill="#121212" stroke="#f87171" stroke-width="2"/>
  <text x="145" y="304" font-size="17" fill="#f87171" font-weight="700" text-anchor="middle">VERIFY FAIL</text>
  <text x="145" y="330" font-size="13" fill="#a3a3a3" text-anchor="middle">no puede cerrar</text>

  <rect x="330" y="270" width="250" height="84" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
  <text x="455" y="304" font-size="17" fill="#a3e635" font-weight="700" text-anchor="middle">VERIFY PASS</text>
  <text x="455" y="330" font-size="13" fill="#a3a3a3" text-anchor="middle">ahora sí: terminado</text>

  <path d="M240,210 C200,232 160,244 150,264" stroke="#f87171" stroke-width="2.5" fill="none" marker-end="url(#rojo)"/>
  <path d="M360,210 C400,232 440,244 450,264" stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#verde)"/>
  <path d="M24,300 C10,200 40,60 106,52" stroke="#f87171" stroke-width="1.8" stroke-dasharray="5 5" fill="none" marker-end="url(#rojo)"/>
  <text x="40" y="200" font-size="13" fill="#f87171">vuelve a</text>
  <text x="40" y="218" font-size="13" fill="#f87171">trabajar</text>

  <text x="300" y="404" font-size="14" fill="#737373" text-anchor="middle">no depende de que el agente se acuerde</text>
</svg>
