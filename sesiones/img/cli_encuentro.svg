      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <g font-size="20" text-anchor="middle">
    <rect x="20" y="40" width="200" height="80" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="120" y="76" fill="#fafafa" font-weight="700">persona</text>
    <text x="120" y="100" fill="#737373" font-size="15">la teclea</text>

