<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Un contexto saturado frente a un orquestador con subagentes que devuelven solo un resumen. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <text x="20" y="28" font-size="16" font-weight="700" fill="#f87171">un agente, todo</text>
  <rect x="20" y="40" width="200" height="380" rx="8" fill="#121212" stroke="#f87171" stroke-width="2"/>
  <g font-size="12" text-anchor="middle">
    <rect x="32" y="54" width="176" height="28" rx="3" fill="#f87171" fill-opacity="0.15"/><text x="120" y="73" fill="#f87171">explorar 40 archivos</text>
    <rect x="32" y="88" width="176" height="28" rx="3" fill="#f87171" fill-opacity="0.15"/><text x="120" y="107" fill="#f87171">logs de pytest</text>
    <rect x="32" y="122" width="176" height="28" rx="3" fill="#f87171" fill-opacity="0.15"/><text x="120" y="141" fill="#f87171">docs de polars</text>
    <rect x="32" y="156" width="176" height="28" rx="3" fill="#f87171" fill-opacity="0.15"/><text x="120" y="175" fill="#f87171">intentos fallidos</text>
    <rect x="32" y="190" width="176" height="28" rx="3" fill="#f87171" fill-opacity="0.15"/><text x="120" y="209" fill="#f87171">revisión del diff</text>
    <rect x="32" y="370" width="176" height="36" rx="3" fill="#121212" stroke="#67e8f9"/><text x="120" y="393" fill="#67e8f9" font-weight="700">tu tarea</text>
  </g>

  <text x="270" y="28" font-size="16" font-weight="700" fill="#a3e635">orquestado</text>
  <rect x="270" y="40" width="310" height="110" rx="8" fill="#121212" stroke="#a3e635" stroke-width="2"/>
  <text x="290" y="70" font-size="15" fill="#a3e635" font-weight="700">orquestador</text>
  <g font-size="12">
    <rect x="290" y="82" width="270" height="24" rx="3" fill="#67e8f9" fill-opacity="0.12"/><text x="300" y="99" fill="#67e8f9">tu tarea</text>
    <rect x="290" y="112" width="130" height="24" rx="3" fill="#a3e635" fill-opacity="0.12"/><text x="300" y="129" fill="#a3e635">resumen 1</text>
    <rect x="430" y="112" width="130" height="24" rx="3" fill="#a3e635" fill-opacity="0.12"/><text x="440" y="129" fill="#a3e635">resumen 2</text>
  </g>

  <g font-size="13" text-anchor="middle">
    <rect x="270" y="250" width="145" height="110" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="342" y="278" fill="#fafafa" font-weight="700">subagente</text>
    <text x="342" y="304" fill="#a3a3a3" font-size="12">explora</text>
    <text x="342" y="322" fill="#a3a3a3" font-size="12">40 archivos</text>
    <rect x="435" y="250" width="145" height="110" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="507" y="278" fill="#fafafa" font-weight="700">subagente</text>
    <text x="507" y="304" fill="#a3a3a3" font-size="12">revisa</text>
    <text x="507" y="322" fill="#a3a3a3" font-size="12">el diff</text>
  </g>
  <g stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M342,246 L350,142"/>
    <path d="M507,246 L495,142"/>
  </g>
  <text x="425" y="210" font-size="12" fill="#a3e635" text-anchor="middle">solo el resumen sube</text>
  <text x="425" y="400" font-size="13" fill="#737373" text-anchor="middle">el ruido se queda abajo</text>
</svg>
