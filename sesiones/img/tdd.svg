<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <g font-size="16" text-anchor="middle">
    <rect x="20" y="100" width="210" height="80" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="125" y="135" fill="#fafafa" font-weight="700">RED</text>
    <text x="125" y="160" fill="#737373" font-size="13">falla: el test mide algo</text>

    <rect x="345" y="100" width="210" height="80" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="450" y="135" fill="#a3e635" font-weight="700">GREEN</text>
    <text x="450" y="160" fill="#737373" font-size="13">lo mínimo, nada de más</text>

    <rect x="670" y="100" width="210" height="80" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="775" y="135" fill="#fafafa" font-weight="700">REFACTOR</text>
    <text x="775" y="160" fill="#737373" font-size="13">limpiar sin riesgo</text>
  </g>
  <g stroke="#525252" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M230,140 L341,140"/>
    <path d="M555,140 L666,140"/>
    <path d="M775,180 C775,270 125,270 125,184"/>
  </g>
  <g font-size="13" fill="#737373" text-anchor="middle">
    <text x="450" y="262">el siguiente comportamiento empieza con otro test que falla</text>
  </g>
</svg>
