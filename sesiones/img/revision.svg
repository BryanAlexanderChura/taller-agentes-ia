<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Diff revisado por otra IA, y las tres capas de revisión: lo mecánico, lo semántico, la decisión. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="520" height="300" rx="8" fill="#121212" stroke="#404040" stroke-width="2"/>
  <text x="40" y="50" font-size="14" fill="#a3a3a3">c01_reporte.py</text>
  <g font-size="14">
    <rect x="30" y="64" width="500" height="28" fill="#f87171" fill-opacity="0.12"/>
    <text x="40" y="83" fill="#f87171">- regional = df["inflacion"].sum() / 8</text>
    <rect x="30" y="94" width="500" height="28" fill="#a3e635" fill-opacity="0.12"/>
    <text x="40" y="113" fill="#a3e635">+ regional = df["inflacion"].mean()</text>
  </g>
  <rect x="40" y="146" width="480" height="150" rx="6" fill="#0d0d0d" stroke="#67e8f9" stroke-width="2"/>
  <text x="60" y="176" font-size="14" fill="#67e8f9" font-weight="700">otra IA revisa:</text>
  <g font-size="14" fill="#d4d4d4">
    <text x="60" y="206">¿el promedio regional es simple o</text>
    <text x="60" y="230">ponderado por población? Costaluna</text>
    <text x="60" y="254">pesa igual que un país diez veces</text>
    <text x="60" y="278">más grande.</text>
  </g>

  <g font-size="15" font-weight="700" text-anchor="middle">
    <rect x="600" y="30" width="280" height="70" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="740" y="60" fill="#a3e635">checker</text>
    <text x="740" y="84" fill="#a3a3a3" font-size="12" font-weight="400">¿corre y pasan los tests?</text>
    <rect x="600" y="135" width="280" height="70" rx="6" fill="#121212" stroke="#67e8f9" stroke-width="2"/>
    <text x="740" y="165" fill="#67e8f9">otra IA</text>
    <text x="740" y="189" fill="#a3a3a3" font-size="12" font-weight="400">¿tiene sentido lo que hace?</text>
    <rect x="600" y="240" width="280" height="70" rx="6" fill="#121212" stroke="#fafafa" stroke-width="2"/>
    <text x="740" y="270" fill="#fafafa">tú</text>
    <text x="740" y="294" fill="#a3a3a3" font-size="12" font-weight="400">¿es lo que pide el paper?</text>
  </g>
  <g stroke="#525252" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M740,102 L740,130"/>
    <path d="M740,207 L740,235"/>
  </g>
</svg>
