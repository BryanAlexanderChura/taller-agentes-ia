<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 420" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- El explorador ordena alfabéticamente; con letra y número ese orden es el de ejecución. -->
  <rect x="20" y="20" width="400" height="330" rx="8" fill="#121212" stroke="#404040" stroke-width="2"/>
  <text x="40" y="52" font-size="16" font-weight="700" fill="#fafafa">scripts/</text>
  <g font-size="17">
    <text x="60" y="100" fill="#d4d4d4"><tspan fill="#a3e635" font-weight="700">a</tspan>01_extraer.py</text>
    <text x="60" y="146" fill="#67e8f9"><tspan font-weight="700">a</tspan>02_extraer_api.py</text>
    <text x="60" y="192" fill="#d4d4d4"><tspan fill="#a3e635" font-weight="700">b</tspan>01_procesar.py</text>
    <text x="60" y="238" fill="#d4d4d4"><tspan fill="#a3e635" font-weight="700">b</tspan>02_validar.py</text>
    <text x="60" y="284" fill="#d4d4d4"><tspan fill="#a3e635" font-weight="700">c</tspan>01_reporte.py</text>
  </g>
  <text x="40" y="330" font-size="12" fill="#737373">orden del explorador = orden de ejecución</text>

  <g font-size="13" fill="#a3a3a3">
    <path d="M440,82 L440,160" stroke="#a3a3a3" stroke-width="2"/>
    <text x="452" y="126">bronze</text>
    <path d="M440,174 L440,252" stroke="#a3a3a3" stroke-width="2"/>
    <text x="452" y="218">silver</text>
    <path d="M440,266 L440,294" stroke="#a3e635" stroke-width="2"/>
    <text x="452" y="285" fill="#a3e635">gold</text>
  </g>

  <rect x="20" y="368" width="560" height="40" rx="6" fill="#67e8f9" fill-opacity="0.08" stroke="#67e8f9" stroke-width="1.5"/>
  <text x="300" y="394" font-size="14" fill="#67e8f9" text-anchor="middle">a02 entra en su lugar: nada se renombra</text>
</svg>
