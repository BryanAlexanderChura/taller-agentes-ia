<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 360" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Lost in the middle: lo del inicio y lo del final se usa mejor que lo del centro. -->
  <g stroke="#404040" stroke-width="1.5" fill="none">
    <path d="M60,40 L60,290 L520,290"/>
  </g>
  <rect x="200" y="40" width="180" height="250" fill="#facc15" fill-opacity="0.06"/>
  <path d="M70,70 C150,90 190,235 290,240 C390,235 430,90 510,62" fill="none" stroke="#a3e635" stroke-width="4" stroke-linecap="round"/>
  <g fill="#a3e635">
    <circle cx="70" cy="70" r="6"/><circle cx="510" cy="62" r="6"/>
  </g>
  <circle cx="290" cy="240" r="6" fill="#facc15"/>
  <g font-size="14" text-anchor="middle">
    <text x="90" y="318" fill="#fafafa">inicio</text>
    <text x="290" y="318" fill="#facc15">medio</text>
    <text x="495" y="318" fill="#fafafa">final</text>
  </g>
  <g font-size="12" fill="#737373" text-anchor="middle">
    <text x="290" y="345">posición en el contexto</text>
    <text x="290" y="215">se pierde</text>
    <text x="118" y="56">AGENTS.md</text>
    <text x="470" y="46">último mensaje</text>
  </g>
  <text x="30" y="165" font-size="12" fill="#737373" text-anchor="middle" transform="rotate(-90 30 165)">cuánto lo usa</text>
</svg>
