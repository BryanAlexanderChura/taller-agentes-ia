<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Tú con el teclado y un agente con comandos llegan a los mismos paneles. -->
  <defs>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <rect x="20" y="30" width="240" height="80" rx="6" fill="#121212" stroke="#fafafa" stroke-width="2"/>
  <text x="40" y="64" font-size="17" fill="#fafafa" font-weight="700">tú</text>
  <text x="40" y="90" font-size="13" fill="#a3a3a3">teclado y mouse</text>

  <rect x="20" y="170" width="430" height="130" rx="6" fill="#0d0d0d" stroke="#a3e635" stroke-width="2"/>
  <text x="40" y="200" font-size="17" fill="#a3e635" font-weight="700">un agente: comandos</text>
  <g font-size="13" fill="#d4d4d4">
    <text x="40" y="230">herdr pane split --direction right</text>
    <text x="40" y="254">herdr agent start revisor --kind codex</text>
    <text x="40" y="278">herdr agent prompt revisor "revisa el diff"</text>
  </g>

  <rect x="580" y="30" width="300" height="270" rx="8" fill="#121212" stroke="#525252" stroke-width="2"/>
  <text x="600" y="58" font-size="14" fill="#a3a3a3" font-weight="700">Herdr</text>
  <g font-size="14">
    <rect x="600" y="74" width="260" height="60" rx="5" fill="#0d0d0d" stroke="#67e8f9"/><text x="616" y="110" fill="#67e8f9">pane: codex</text>
    <rect x="600" y="144" width="260" height="60" rx="5" fill="#0d0d0d" stroke="#a3e635"/><text x="616" y="180" fill="#a3e635">pane: revisor</text>
    <rect x="600" y="214" width="260" height="60" rx="5" fill="#0d0d0d" stroke="#404040"/><text x="616" y="250" fill="#a3a3a3">pane: tests</text>
  </g>
  <path d="M264,70 C420,70 450,100 574,104" stroke="#525252" stroke-width="2.5" fill="none" marker-end="url(#gris)"/>
  <path d="M454,236 C520,236 520,180 574,176" stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#verde)"/>
  <text x="300" y="150" font-size="13" fill="#737373">mismos paneles, dos formas de llegar</text>
</svg>
