<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Cache de prompt: lo que no cambió desde el inicio se reutiliza; cambiar algo
       invalida eso y todo lo que viene después. -->
  <g font-size="13" fill="#737373">
    <text x="20" y="28">turno siguiente, sin tocar el inicio</text>
    <text x="20" y="143">turno siguiente, editando AGENTS.md</text>
  </g>

  <g font-size="14" text-anchor="middle" font-weight="700">
    <g fill="#a3e635" fill-opacity="0.16" stroke="#a3e635" stroke-width="1.5">
      <rect x="20" y="40" width="110" height="46" rx="5"/>
      <rect x="136" y="40" width="130" height="46" rx="5"/>
      <rect x="272" y="40" width="90" height="46" rx="5"/>
      <rect x="368" y="40" width="110" height="46" rx="5"/>
      <rect x="484" y="40" width="110" height="46" rx="5"/>
    </g>
    <rect x="600" y="40" width="110" height="46" rx="5" fill="#121212" stroke="#fafafa" stroke-width="1.5"/>
    <g fill="#a3e635">
      <text x="75" y="68">system</text>
      <text x="201" y="68">AGENTS.md</text>
      <text x="317" y="68">tools</text>
      <text x="423" y="68">turno 1</text>
      <text x="539" y="68">turno 2</text>
    </g>
    <text x="655" y="68" fill="#fafafa">nuevo</text>

    <rect x="20" y="155" width="110" height="46" rx="5" fill="#a3e635" fill-opacity="0.16" stroke="#a3e635" stroke-width="1.5"/>
    <g fill="#f87171" fill-opacity="0.14" stroke="#f87171" stroke-width="1.5">
      <rect x="136" y="155" width="130" height="46" rx="5" stroke-width="2.5"/>
      <rect x="272" y="155" width="90" height="46" rx="5"/>
      <rect x="368" y="155" width="110" height="46" rx="5"/>
      <rect x="484" y="155" width="110" height="46" rx="5"/>
      <rect x="600" y="155" width="110" height="46" rx="5"/>
    </g>
    <text x="75" y="183" fill="#a3e635">system</text>
    <g fill="#f87171">
      <text x="201" y="183">AGENTS.md *</text>
      <text x="317" y="183">tools</text>
      <text x="423" y="183">turno 1</text>
      <text x="539" y="183">turno 2</text>
      <text x="655" y="183">nuevo</text>
    </g>
  </g>

  <g font-size="13">
    <text x="728" y="60" fill="#a3e635">reutilizado</text>
    <text x="728" y="78" fill="#d4d4d4">solo se paga lo nuevo</text>
    <text x="728" y="175" fill="#f87171">cambió el inicio</text>
    <text x="728" y="193" fill="#d4d4d4">se paga todo de nuevo</text>
  </g>
  <g font-size="12" fill="#737373">
    <text x="20" y="108">el cache vale para el inicio que no cambió</text>
    <text x="136" y="226">desde el primer cambio, nada se reutiliza</text>
  </g>
</svg>
