<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 250" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Atención: "estaba" mira a todas las palabras; el grosor es cuánto pesa cada una. -->
  <g fill="none" stroke-linecap="round">
    <path d="M595,150 C595,40 185,40 185,150" stroke="#a3e635" stroke-width="7"/>
    <path d="M595,150 C595,95 470,95 470,150" stroke="#a3e635" stroke-width="3" stroke-opacity="0.7"/>
    <path d="M595,150 C595,105 360,105 360,150" stroke="#525252" stroke-width="1.5"/>
    <path d="M595,150 C595,60 70,60 70,150" stroke="#525252" stroke-width="1"/>
    <path d="M595,150 C595,80 275,80 275,150" stroke="#525252" stroke-width="1"/>
    <path d="M595,150 C595,110 730,110 730,150" stroke="#a3e635" stroke-width="4" stroke-opacity="0.8"/>
  </g>
  <g font-size="22" text-anchor="middle" fill="#a3a3a3">
    <text x="70" y="182">El</text>
    <text x="185" y="182" fill="#fafafa" font-weight="700">servidor</text>
    <text x="275" y="182">no</text>
    <text x="360" y="182">respondió</text>
    <text x="470" y="182">porque</text>
    <rect x="535" y="158" width="120" height="34" rx="5" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="595" y="182" fill="#a3e635" font-weight="700">estaba</text>
    <text x="730" y="182" fill="#fafafa">caído</text>
  </g>
  <g font-size="13" fill="#737373" text-anchor="middle">
    <text x="450" y="232">cada palabra mira a todas las demás; el grosor es cuánto le importa cada una</text>
  </g>
</svg>
