<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 340" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- AGENTS.md encabeza el contexto en cada turno: largo ocupa espacio y atención siempre; corto deja sitio. -->
  <g font-size="14" font-weight="700">
    <text x="20" y="30" fill="#f87171">AGENTS.md largo</text>
    <text x="20" y="190" fill="#a3e635">AGENTS.md corto</text>
  </g>
  <g font-size="11" fill="#737373">
    <text x="20" y="48">en cada turno</text>
    <text x="20" y="208">en cada turno</text>
  </g>

  <!-- largo -->
  <g>
    <rect x="20" y="60" width="330" height="34" rx="4" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5"/>
    <rect x="356" y="60" width="150" height="34" rx="4" fill="#121212" stroke="#404040" stroke-width="1.5"/>
    <rect x="512" y="60" width="88" height="34" rx="4" fill="#121212" stroke="#67e8f9" stroke-width="1.5"/>
    <rect x="20" y="102" width="330" height="34" rx="4" fill="#f87171" fill-opacity="0.18" stroke="#f87171" stroke-width="1.5"/>
    <rect x="356" y="102" width="150" height="34" rx="4" fill="#121212" stroke="#404040" stroke-width="1.5"/>
    <rect x="512" y="102" width="88" height="34" rx="4" fill="#121212" stroke="#67e8f9" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="185" y="82" fill="#f87171">reglas, procedimientos, todo</text>
    <text x="185" y="124" fill="#f87171">reglas, procedimientos, todo</text>
    <text x="431" y="82" fill="#a3a3a3">chat</text>
    <text x="431" y="124" fill="#a3a3a3">chat</text>
    <text x="556" y="82" fill="#67e8f9">tarea</text>
    <text x="556" y="124" fill="#67e8f9">tarea</text>
  </g>
  <text x="20" y="160" font-size="11" fill="#737373">compite por atención con tu tarea, turno tras turno</text>

  <!-- corto -->
  <g>
    <rect x="20" y="220" width="90" height="34" rx="4" fill="#a3e635" fill-opacity="0.18" stroke="#a3e635" stroke-width="1.5"/>
    <rect x="116" y="220" width="260" height="34" rx="4" fill="#121212" stroke="#404040" stroke-width="1.5"/>
    <rect x="382" y="220" width="218" height="34" rx="4" fill="#121212" stroke="#67e8f9" stroke-width="1.5"/>
    <rect x="20" y="262" width="90" height="34" rx="4" fill="#a3e635" fill-opacity="0.18" stroke="#a3e635" stroke-width="1.5"/>
    <rect x="116" y="262" width="260" height="34" rx="4" fill="#121212" stroke="#404040" stroke-width="1.5"/>
    <rect x="382" y="262" width="218" height="34" rx="4" fill="#121212" stroke="#67e8f9" stroke-width="1.5"/>
  </g>
  <g font-size="12" text-anchor="middle">
    <text x="65" y="242" fill="#a3e635">reglas</text>
    <text x="65" y="284" fill="#a3e635">reglas</text>
    <text x="246" y="242" fill="#a3a3a3">chat</text>
    <text x="246" y="284" fill="#a3a3a3">chat</text>
    <text x="491" y="242" fill="#67e8f9">tarea</text>
    <text x="491" y="284" fill="#67e8f9">tarea</text>
  </g>
  <text x="20" y="320" font-size="11" fill="#737373">deja sitio a la tarea; lo largo vive en skills y docs</text>
</svg>
