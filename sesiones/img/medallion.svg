<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" font-family="JetBrains Mono, ui-monospace, monospace">
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <g font-size="16" text-anchor="middle">
    <rect x="20" y="60" width="210" height="100" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="125" y="95" fill="#fafafa" font-weight="700">bronze</text>
    <text x="125" y="120" fill="#737373" font-size="13">a  extraer</text>
    <text x="125" y="142" fill="#737373" font-size="13">crudo, tal como llega</text>

    <rect x="345" y="60" width="210" height="100" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
    <text x="450" y="95" fill="#fafafa" font-weight="700">silver</text>
    <text x="450" y="120" fill="#737373" font-size="13">b  procesar</text>
    <text x="450" y="142" fill="#737373" font-size="13">limpio y validado</text>

    <rect x="670" y="60" width="210" height="100" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="775" y="95" fill="#a3e635" font-weight="700">gold</text>
    <text x="775" y="120" fill="#737373" font-size="13">c  reporte</text>
    <text x="775" y="142" fill="#737373" font-size="13">listo para consumo</text>
  </g>
  <g stroke="#525252" stroke-width="2.5" fill="none" marker-end="url(#flecha)">
    <path d="M230,110 L341,110"/>
    <path d="M555,110 L666,110"/>
  </g>
  <g font-size="13" fill="#737373" text-anchor="middle">
    <text x="450" y="215">cada capa lee solo la anterior</text>
  </g>
</svg>
