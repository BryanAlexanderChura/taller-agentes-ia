<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 400" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Mapa de significados: palabras cercanas significan algo parecido. -->
  <g fill="#a3e635" fill-opacity="0.05" stroke="#404040" stroke-dasharray="4 5">
    <ellipse cx="150" cy="120" rx="125" ry="85"/>
    <ellipse cx="470" cy="105" rx="120" ry="72"/>
    <ellipse cx="465" cy="305" rx="115" ry="68"/>
  </g>
  <g font-size="12" fill="#737373" text-anchor="middle">
    <text x="150" y="28">dinero</text>
    <text x="470" y="26">código</text>
    <text x="465" y="390">animales</text>
  </g>

  <g stroke="#a3e635" stroke-width="2" stroke-dasharray="5 4" fill="none">
    <path d="M160,268 L118,104"/>
    <path d="M160,268 L196,150"/>
  </g>
  <path d="M160,268 L438,300" stroke="#404040" stroke-width="1.5" stroke-dasharray="3 6" fill="none"/>

  <g font-size="15" text-anchor="middle">
    <g fill="#fafafa">
      <circle cx="118" cy="104" r="5" fill="#a3e635"/><text x="118" y="90">factura</text>
      <circle cx="196" cy="150" r="5" fill="#a3e635"/><text x="196" y="174">pago</text>
      <circle cx="80" cy="160" r="5" fill="#737373"/><text x="80" y="184">boleta</text>
      <circle cx="215" cy="85" r="5" fill="#737373"/><text x="215" y="71">deuda</text>

      <circle cx="420" cy="90" r="5" fill="#737373"/><text x="420" y="76">función</text>
      <circle cx="515" cy="70" r="5" fill="#737373"/><text x="515" y="56">método</text>
      <circle cx="500" cy="135" r="5" fill="#737373"/><text x="500" y="159">clase</text>

      <circle cx="438" cy="300" r="5" fill="#737373"/><text x="438" y="286">perro</text>
      <circle cx="510" cy="320" r="5" fill="#737373"/><text x="510" y="344">gato</text>
      <circle cx="420" cy="345" r="5" fill="#737373"/><text x="420" y="369">mascota</text>
    </g>
    <rect x="62" y="252" width="196" height="34" rx="5" fill="#121212" stroke="#a3e635" stroke-width="2"/>
    <text x="160" y="274" fill="#a3e635" font-weight="700">«cobrar al cliente»</text>
  </g>
  <g font-size="12" fill="#737373">
    <text x="62" y="306">busca por significado:</text>
    <text x="62" y="322">llega a factura y pago</text>
    <text x="62" y="338">sin compartir palabras</text>
    <text x="300" y="276">lejos: otro tema</text>
  </g>
</svg>
