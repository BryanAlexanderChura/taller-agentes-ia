<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Un comando crea siempre el mismo esqueleto. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="560" height="56" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
  <text x="40" y="55" font-size="18" fill="#a3e635" font-weight="700">&gt; /new-module ventas</text>
  <path d="M300,82 L300,112" stroke="#a3e635" stroke-width="2.5" marker-end="url(#flecha)"/>

  <rect x="20" y="120" width="560" height="300" rx="6" fill="#121212" stroke="#404040" stroke-width="2"/>
  <g font-size="16" fill="#d4d4d4">
    <text x="40" y="154" fill="#fafafa" font-weight="700">ventas/</text>
    <text x="64" y="186">.gitignore</text><text x="560" y="186" fill="#737373" font-size="13" text-anchor="end">ignora data/</text>
    <text x="64" y="218">data/</text><text x="560" y="218" fill="#737373" font-size="13" text-anchor="end">fuera de git</text>
    <text x="64" y="250">scripts/</text><text x="560" y="250" fill="#737373" font-size="13" text-anchor="end">a01 · b01 · c01</text>
    <text x="64" y="282">tests/</text><text x="560" y="282" fill="#facc15" font-size="13" text-anchor="end">vacía: falta el primer test</text>
    <text x="64" y="314">docs/</text><text x="560" y="314" fill="#737373" font-size="13" text-anchor="end">RESUME · CHANGELOG</text>
    <text x="64" y="346">config/</text><text x="560" y="346" fill="#737373" font-size="13" text-anchor="end">config.yaml</text>
  </g>
  <text x="300" y="398" font-size="13" fill="#a3e635" text-anchor="middle">igual cada vez; si la ruta existe, no la toca</text>
</svg>
