<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 380" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Tres zonas de lo que sabemos. El trabajo es mover cosas de la tercera a la segunda. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
  </defs>

  <rect x="30" y="16" width="210" height="62" rx="6" fill="#a3e635" fill-opacity="0.16" stroke="#a3e635" stroke-width="2"/>
  <text x="46" y="42" font-size="15" fill="#a3e635" font-weight="700">sé que lo sé</text>
  <text x="46" y="63" font-size="12" fill="#d4d4d4">lo usas y lo verificas</text>

  <rect x="30" y="92" width="330" height="80" rx="6" fill="#67e8f9" fill-opacity="0.10" stroke="#67e8f9" stroke-width="2"/>
  <text x="46" y="122" font-size="15" fill="#67e8f9" font-weight="700">sé que no lo sé</text>
  <text x="46" y="145" font-size="12" fill="#d4d4d4">se lo preguntas: la IA lo resuelve</text>

  <rect x="30" y="186" width="560" height="178" rx="6" fill="#0d0d0d" stroke="#3a3a3a" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="46" y="216" font-size="15" fill="#a3a3a3" font-weight="700">no sé que no lo sé</text>
  <text x="46" y="238" font-size="12" fill="#737373">ni lo pides: gana el promedio</text>
  <g font-size="13" fill="#3d3d3d">
    <text x="70" y="290">duckdb</text>
    <text x="190" y="275">worktrees</text>
    <text x="320" y="300">hooks</text>
    <text x="120" y="338">MCP</text>
    <text x="250" y="342">polars</text>
    <text x="400" y="335">ruff</text>
    <text x="500" y="300">pytest</text>
    <text x="505" y="350">uv</text>
  </g>

  <path d="M470,250 C470,200 440,140 366,134" stroke="#a3e635" stroke-width="2.5" fill="none" marker-end="url(#flecha)"/>
  <g font-size="12" fill="#a3e635">
    <text x="400" y="62" font-weight="700">fundamentos:</text>
    <text x="400" y="80">el nombre y</text>
    <text x="400" y="98">para qué sirve</text>
  </g>
  <path d="M470,104 L470,120" stroke="#a3e635" stroke-width="1" stroke-dasharray="2 3"/>
</svg>
