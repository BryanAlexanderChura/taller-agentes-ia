<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 440" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Carga progresiva de una skill: descripción siempre, cuerpo al usarla, scripts sin entrar al contexto. -->
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
  </defs>
  <g font-size="13" font-weight="700">
    <text x="20" y="34" fill="#f87171">siempre</text>
    <text x="20" y="168" fill="#facc15">al usarla</text>
    <text x="20" y="330" fill="#a3e635">sin entrar al contexto</text>
  </g>

  <rect x="20" y="46" width="560" height="56" rx="5" fill="#121212" stroke="#f87171" stroke-width="2"/>
  <text x="38" y="72" font-size="15" fill="#fafafa" font-weight="700">description:</text>
  <text x="38" y="92" font-size="14" fill="#a3a3a3">"Verifica un módulo antes de declarar terminado"</text>
  <text x="580" y="122" font-size="12" fill="#737373" text-anchor="end">una línea: decide si la carga</text>

  <path d="M300,128 L300,150" stroke="#525252" stroke-width="2.5" marker-end="url(#flecha)"/>

  <rect x="20" y="180" width="560" height="108" rx="5" fill="#121212" stroke="#facc15" stroke-width="2"/>
  <g font-size="14" fill="#d4d4d4">
    <text x="38" y="208" font-weight="700" fill="#fafafa">SKILL.md</text>
    <text x="38" y="232">## Reglas</text>
    <text x="38" y="254">## Pasos</text>
    <text x="38" y="276">## Antipatrones · Historial</text>
  </g>

  <path d="M300,294 L300,316" stroke="#525252" stroke-width="2.5" marker-end="url(#flecha)"/>

  <rect x="20" y="342" width="560" height="62" rx="5" fill="#121212" stroke="#a3e635" stroke-width="2" stroke-dasharray="7 5"/>
  <text x="38" y="368" font-size="14" fill="#fafafa" font-weight="700">scripts/check.py</text>
  <text x="38" y="390" font-size="13" fill="#a3a3a3">corre y devuelve solo el resultado</text>
  <text x="580" y="428" font-size="12" fill="#737373" text-anchor="end">lo mecánico lo hace código</text>
</svg>
