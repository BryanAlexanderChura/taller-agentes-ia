<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" font-family="JetBrains Mono, ui-monospace, monospace">
  <!-- Un brief concreto entra; el worker trabaja en su worktree; solo lo que da PASS se integra. -->
  <defs>
    <marker id="gris" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#525252"/>
    </marker>
    <marker id="verde" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#a3e635"/>
    </marker>
    <marker id="rojo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f87171"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="330" height="290" rx="8" fill="#121212" stroke="#fafafa" stroke-width="2"/>
  <text x="40" y="50" font-size="15" fill="#fafafa" font-weight="700">brief</text>
  <g font-size="13">
    <text x="40" y="84" fill="#a3e635" font-weight="700">Tarea</text><text x="40" y="104" fill="#d4d4d4">T03 tabla de shocks</text>
    <text x="40" y="138" fill="#a3e635" font-weight="700">Archivos</text><text x="40" y="158" fill="#d4d4d4">c01_reporte.py</text><text x="40" y="176" fill="#d4d4d4">test_c01_reporte.py</text>
    <text x="40" y="210" fill="#f87171" font-weight="700">No tocar</text><text x="40" y="230" fill="#d4d4d4">b01_procesar.py</text>
    <text x="40" y="264" fill="#67e8f9" font-weight="700">Entrega</text><text x="40" y="284" fill="#d4d4d4">VERIFY PASS</text>
  </g>

  <rect x="400" y="110" width="190" height="100" rx="6" fill="#121212" stroke="#67e8f9" stroke-width="2"/>
  <text x="495" y="146" font-size="16" fill="#67e8f9" font-weight="700" text-anchor="middle">worker</text>
  <text x="495" y="172" font-size="12" fill="#a3a3a3" text-anchor="middle">en wt/reporte</text>
  <text x="495" y="190" font-size="12" fill="#a3a3a3" text-anchor="middle">solo sabe lo del brief</text>

  <rect x="640" y="125" width="110" height="70" rx="6" fill="#121212" stroke="#facc15" stroke-width="2"/>
  <text x="695" y="166" font-size="14" fill="#facc15" font-weight="700" text-anchor="middle">check</text>

  <rect x="772" y="40" width="122" height="70" rx="6" fill="#121212" stroke="#a3e635" stroke-width="2"/>
  <text x="833" y="72" font-size="14" fill="#a3e635" font-weight="700" text-anchor="middle">PASS</text>
  <text x="833" y="94" font-size="11" fill="#a3a3a3" text-anchor="middle">se integra</text>
  <rect x="772" y="210" width="122" height="70" rx="6" fill="#121212" stroke="#f87171" stroke-width="2"/>
  <text x="833" y="242" font-size="14" fill="#f87171" font-weight="700" text-anchor="middle">FAIL</text>
  <text x="833" y="264" font-size="11" fill="#a3a3a3" text-anchor="middle">queda en su rama</text>

  <g stroke-width="2.5" fill="none">
    <path d="M354,160 L394,160" stroke="#525252" marker-end="url(#gris)"/>
    <path d="M594,160 L634,160" stroke="#525252" marker-end="url(#gris)"/>
    <path d="M752,140 C762,110 760,90 768,80" stroke="#a3e635" marker-end="url(#verde)"/>
    <path d="M752,180 C762,210 760,230 768,240" stroke="#f87171" marker-end="url(#rojo)"/>
  </g>
</svg>
